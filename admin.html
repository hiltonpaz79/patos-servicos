<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin - Patos Serviços</title>
<link rel="icon" type="image/png" href="imagens_icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style_admin.css">
</head>
<body>
<div class="pagina">
<header class="cabecalho">
  <img src="imagens_icons/logo-patos-servicos.png" alt="Patos Serviços">
  <h1>Painel de aprovação</h1>
  <p>Admin - Patos Serviços</p>
</header>
<div class="topo">
  <select id="status">
    <option value="em_analise">Em análise</option>
    <option value="aguardando_pagamento">Aguardando pagamento</option>
    <option value="ativo">Ativos</option>
    <option value="recusado">Recusados</option>
    <option value="removido">Removidos</option>
    <option value="arquivado">Arquivados (já no GitHub)</option>
  </select>
  <button id="recarregar">Atualizar</button>
  <button id="arquivarTodos" class="ok" hidden>Arquivar todos os ativos</button>
</div>
<div class="grid" id="lista"></div>
</div>

<script>
let token = sessionStorage.getItem('adm') || prompt('Token de administrador:') || '';
sessionStorage.setItem('adm', token);
const $ = (id) => document.getElementById(id);
const dt = (t) => t ? new Date(t).toLocaleDateString('pt-BR') : '—';
const txt = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const attr = (s) => txt(s).replace(/"/g, '&quot;');

async function carregar() {
  const r = await fetch('/api/admin?status=' + $('status').value, { headers: { Authorization: 'Bearer ' + token } });
  if (r.status === 401) { sessionStorage.removeItem('adm'); $('lista').innerHTML = '<p class="vazio">Token inválido. Recarregue a página.</p>'; return; }
  const { itens } = await r.json();
  $('lista').innerHTML = itens.length ? '' : '<p class="vazio">Nada por aqui.</p>';
  $('arquivarTodos').hidden = !($('status').value === 'ativo' && itens.length);
  itens.forEach(c => {
    const fn = c.filtros_novos ? JSON.parse(c.filtros_novos) : { cidades: [], categorias: [] };
    const d = document.createElement('div'); d.className = 'c';
    d.innerHTML = `
      <span class="pl ${c.plano}">${c.plano.toUpperCase()}</span>
      ${c.imagem_id ? `<a class="arte" href="/api/imagem/${c.imagem_id}?t=${encodeURIComponent(token)}" download="${c.id}.jpg" target="_blank"><img src="/api/imagem/${c.imagem_id}?t=${encodeURIComponent(token)}" alt=""></a>` : ''}
      <p class="nome">${txt(c.nome)}</p>
      ${c.slogan ? `<p class="slogan"><em>${txt(c.slogan)}</em></p>` : ''}
      ${c.descricao ? `<p class="desc">${txt(c.descricao)}</p>` : ''}
      <p class="contato">📱 <a href="https://wa.me/${c.whatsapp}" target="_blank">${c.whatsapp}</a>${c.instagram ? ` · 📷 @${txt(c.instagram)}` : ''}</p>
      <p class="meta">📍 ${JSON.parse(c.cidades).map(txt).join(', ')}<br>🏷️ ${JSON.parse(c.categorias).map(txt).join(', ')}</p>
      <p class="datas">Criado: ${dt(c.criado_em)} · Pago: ${dt(c.pago_em)} · Ativo: ${dt(c.ativo_em)} · Expira: ${dt(c.expira_em)}</p>
      <p class="id">ID: ${c.id} (nome do arquivo para imagens_cards: ${c.id}.jpg)</p>
      ${(fn.cidades.length || fn.categorias.length) ? `<p class="novo">🆕 ${fn.cidades.length ? 'Cidade nova: <strong>' + fn.cidades.map(i => txt(i.nome)).join(', ') + '</strong>' : ''} ${fn.categorias.length ? 'Ramo novo: <strong>' + fn.categorias.map(i => txt(i.nome)).join(', ') + '</strong>' : ''} — confira a escrita em Editar.</p>` : ''}
      ${c.status !== 'arquivado' ? `<details><summary>✏️ Editar / corrigir</summary>
        <label>Nome<input class="e-nome" maxlength="60" value="${attr(c.nome)}"></label>
        ${c.plano !== 'gratis' ? `<label>Slogan<input class="e-slogan" maxlength="80" value="${attr(c.slogan)}"></label>
        <label>Descrição<textarea class="e-desc" maxlength="600">${txt(c.descricao)}</textarea></label>` : ''}
        ${fn.cidades.map(i => `<label>🆕 Cidade nova<input class="e-cid" maxlength="40" data-valor="${attr(i.valor)}" value="${attr(i.nome)}"></label>`).join('')}
        ${fn.categorias.map(i => `<label>🆕 Ramo novo<input class="e-cat" maxlength="40" data-valor="${attr(i.valor)}" value="${attr(i.nome)}"></label>`).join('')}
        <div class="acoes"><button class="ok e-salvar">Salvar correções</button></div>
      </details>` : ''}
      <div class="acoes"></div>`;
    const salvar = d.querySelector('.e-salvar');
    if (salvar) salvar.onclick = async () => {
      const lista = (cls) => [...d.querySelectorAll(cls)].map(i => ({ valor: i.dataset.valor, nome: i.value }));
      const corpo = { id: c.id, acao: 'editar', nome: d.querySelector('.e-nome').value,
        cidades_novas: lista('.e-cid'), categorias_novas: lista('.e-cat') };
      if (d.querySelector('.e-slogan')) { corpo.slogan = d.querySelector('.e-slogan').value; corpo.descricao = d.querySelector('.e-desc').value; }
      salvar.disabled = true; salvar.textContent = 'Salvando...';
      const r = await fetch('/api/admin', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify(corpo) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) alert('Erro: ' + (j.erro || r.status)); else alert('Correções salvas.');
      carregar();
    };
    const ac = d.querySelector('.acoes');
    const bt = (rot, cls, acao, pedeMotivo) => {
      const b = document.createElement('button'); b.textContent = rot; b.className = cls;
      b.onclick = async () => {
        if (acao === 'arquivar' && !confirm('Enviar imagem e dados para o GitHub e apagar a imagem do D1?')) return;
        const motivo = pedeMotivo ? prompt('Motivo (opcional):') : null;
        if (pedeMotivo && motivo === null) return;
        b.disabled = true; b.textContent = 'Aguarde...';
        const r = await fetch('/api/admin', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ id: c.id, acao, motivo }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) alert('Erro: ' + (j.erro || r.status)); else if (j.aviso) alert(j.aviso);
        carregar();
      };
      ac.appendChild(b);
    };
    if (c.status === 'em_analise') { bt('Aprovar', 'ok', 'aprovar'); bt('Recusar', 'no', 'recusar', true); }
    if (c.status === 'ativo') { bt('Arquivar no GitHub', 'ok', 'arquivar'); bt('Remover', 'no', 'remover', true); }
    if (c.status === 'recusado' || c.status === 'removido') bt('Reativar', 'ok', 'aprovar');
    $('lista').appendChild(d);
  });
}
$('arquivarTodos').onclick = async () => {
  if (!confirm('Enviar os cards ativos (até 20 por vez) ao GitHub num único commit e apagar as imagens do D1?')) return;
  const b = $('arquivarTodos'); b.disabled = true; b.textContent = 'Aguarde...';
  const r = await fetch('/api/admin', { method: 'POST', headers: { Authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: JSON.stringify({ acao: 'arquivar_todos' }) });
  const j = await r.json().catch(() => ({}));
  alert(r.ok ? j.aviso : 'Erro: ' + (j.erro || r.status));
  b.disabled = false; b.textContent = 'Arquivar todos os ativos';
  carregar();
};
$('status').onchange = carregar; $('recarregar').onclick = carregar; carregar();
</script>
</body>
</html>
